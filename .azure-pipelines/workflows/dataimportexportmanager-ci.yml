trigger:
  branches:
    include:
      - feature/*
      - dev
      - master

pr:
  branches:
    include:
      - dev
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  BuildConfiguration: 'Release'
  PackageOutputRoot: '$(Build.ArtifactStagingDirectory)/packages'
  PackageOutput: '$(PackageOutputRoot)/$(Build.SourceBranchName)/$(Build.BuildId)'
  PackageArtifactName: 'nuget-packages-$(Build.BuildId)'

stages:
  - stage: Validate
    displayName: 'Validate (feature/dev and PR gates)'
    condition: or(ne(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: BuildAndTest
        displayName: 'Restore, build, and test'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: 'Use .NET SDK 10.x'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'
              includePreviewVersions: true

          - script: dotnet restore DataImportExportManager.sln
            displayName: 'dotnet restore'

          - script: dotnet build DataImportExportManager.sln --configuration $(BuildConfiguration) --no-restore
            displayName: 'dotnet build'

          - script: dotnet test DataImportExportManager.sln --configuration $(BuildConfiguration) --no-build --verbosity normal
            displayName: 'dotnet test'

  - stage: Deliver
    displayName: 'Deliver (master merge)'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PackAndPublish
        displayName: 'Pack and publish delivery artifacts'
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: 'Use .NET SDK 10.x'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'
              includePreviewVersions: true

          - script: dotnet restore DataImportExportManager.sln
            displayName: 'dotnet restore (delivery)'

          - script: dotnet build DataImportExportManager.sln --configuration $(BuildConfiguration) --no-restore
            displayName: 'dotnet build (delivery)'

          - script: dotnet pack DataImportExportManager.csproj --configuration $(BuildConfiguration) --no-build --output $(PackageOutput)
            displayName: 'dotnet pack'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish package artifacts'
            inputs:
              targetPath: '$(PackageOutput)'
              artifact: '$(PackageArtifactName)'
              publishLocation: 'pipeline'
